 const fee=S.gender==="male"?n.dowry:0;
 const meets=owner||(S.house>=n.house&&car>=n.car&&job>=n.job&&S.money>=fee);
 if(!meets){lifePanel("لم تكتمل الشروط",'<div class="lifeCard">هذه الشخصية تحتاج بيتاً مستوى '+n.house+'، وسيارة مستوى '+n.car+'، ووظيفة مستوى '+n.job+(fee?'، ومهراً $'+fmt(fee):'')+'. طوّر ممتلكاتك وحاول مجدداً.</div>');return}
 const accepts=owner||Math.random()<0.62;
 if(accepts){if(fee&&!budgetPay(fee,"مهر الزواج"))return;S.spouse={name:n.name,role:S.gender==="male"?"زوجة":"زوج",since:Date.now(),love:75,att:n.att};if(Math.random()<.35){S.spouse.jobKey=JOB_KEYS[Math.floor(Math.random()*JOB_KEYS.length)];S.spouse.jobLevel=1+Math.floor(Math.random()*3)}S.married=true;dirty=true;hud();lifePanel("🎉 مبروك الزواج!",'<div class="lifeCard">وافق/ت '+escapeText(n.name)+' على الزواج! أصبحتما عائلة واحدة. يمكنك زيارة قسم العائلة للتفاعل وإنجاب الأبناء.</div>');}
 else lifePanel("💌 طلبك قيد التفكير",'<div class="lifeCard">شكراً على طلبك، لكن '+escapeText(n.name)+' قرر/ت عدم الموافقة هذه المرة. يمكنك تطوير حياتك والمحاولة مع شخصية أخرى.</div>');
}

function zxAlbumAdd(title,desc,emoji="📸"){

function zxReputationAdd(points,reason){

  dirty=true;

function hud(){
  normalizeJobs();const p=currentProgress(),lv=jobLevel(),need=promotionCount(p.level);
  $("money").textContent="$"+fmt(S.money);
  $("job").textContent=currentJob().name+" · "+lv[0]+" · مستوى "+p.level+" · التقدم: "+p.works+"/"+need+" · الراتب $"+jobSalary(S.activeJob,lv)+" / "+effectiveWorkMinutes(lv[2])+" دقيقة مع السيارة";
  $("inc").textContent=fmt(S.earned);$("exp").textContent=fmt(S.spent);
  $("bu").textContent=S.house>=MAXH?"البيت بالحد الأقصى":"طوّر البيت $"+fmt(upCost(S.house));
  $("bu").disabled=S.house>=MAXH;
  $("log").innerHTML=(S.log||[]).map(l=>"<div><span>"+l.t+"</span><span class='"+(l.a>=0?"p":"n")+"'>"+(l.a>=0?"+":"")+fmt(l.a)+"</span></div>").join("")||"<div>لا يوجد سجل بعد</div>";
}
function jobSalary(jobId,level){const progress=S.jobs?.[jobId];return Math.round((progress?.famous?1000:level[1])*(Number(WORLD.salaryMultiplier)||1))}
function finishWork(){
  if(!S||!S.workUntil)return;
  const jobId=S.workJob||S.activeJob;
  const level=JOBS[jobId]?.levels?.[(S.jobs?.[jobId]?.level||1)-1];
  if(!level){S.workUntil=null;S.workJob=null;return}
  const salary=jobSalary(jobId,level);S.bankSalary=(Number(S.bankSalary)||0)+salary;toast("🏦 وصل راتبك $"+fmt(salary)+" للبنك، روح استلمه");
  const p=S.jobs[jobId];p.works++;
  log("راتب بالبنك: "+JOBS[jobId].name+" - "+level[0],0);
  S.workUntil=null;S.workJob=null;
  if(p.level<jobMaxLevel(jobId)&&p.works>=promotionCount(p.level)){
    p.level++;p.works=0;
    const next=JOBS[jobId].levels[p.level-1];
    toast("🎉 مبروك! ترقيت إلى "+next[0]+" في "+JOBS[jobId].name);
    log("ترقية إلى "+next[0],0);
    setTimeout(()=>alert("🎉 مبروك الترقية!\nأصبحت: "+next[0]+"\n\nدورك الجديد: "+next[3]+"\n\nراتبك الجديد: $"+next[1]+" مقابل "+next[2]+" دقيقة عمل."),150);
  }else if(p.level===jobMaxLevel(jobId)){toast("أنت في أعلى مستوى! استمر بالعمل لتحصل على راتبك.")}
  dirty=true;hud();syncHouses();updateWorkButton();
}
function updateWorkButton(){
 const b=$("bw");if(!b||!S)return;
 if(S.workUntil){const left=Math.max(0,Math.ceil((S.workUntil-Date.now())/1000));if(left<=0){finishWork();return}b.disabled=true;b.textContent="جاري العمل ⏳ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")}
 else{b.disabled=false;b.textContent="ابدأ العمل 💼"}
}
function work(){
  if(Date.now()<cd||S.workUntil)return;cd=Date.now()+800;
  normalizeJobs();const lv=jobLevel();
  S.workJob=S.activeJob;const minutes=effectiveWorkMinutes(lv[2]);S.workUntil=Date.now()+minutes*60*1000;
  dirty=true;toast("بدأت العمل! سيصلك راتب $"+jobSalary(S.activeJob,lv)+" بعد "+minutes+" دقيقة."+(carLevel()>1?" (خصم السيارة "+(carLevel()-1)+" دقيقة)":""));
  updateWorkButton();
}

function changePlayer(id,p,amount){
  const delta=typeof amount==='object'?(Number(amount.money)||0):(Number(amount)||0);
  const next={...p,money:(Number(p.money)||0)+delta,earned:(Number(p.earned)||0)+delta};
  if(id===me){S=next;players[me]=S;dirty=true;hud();toast('تمت إضافة $'+fmt(amount));drawOwnerPlayers();return}
  if(!db){toast('إعطاء لاعب آخر يحتاج اتصال متعدد اللاعبين');return}
  db.doc('players/'+id).set(next).then(()=>toast('تم إرسال $'+fmt(amount)+' للاعب')).catch(()=>toast('تعذر إرسال المبلغ'));
}
function giveItem(id,p,name){
  const icons={'قطة':'🐱','سيارة':'🚗','تاج':'👑','دراجة':'🚲','بيت':'🏠','شجرة':'🌳'};
  const next={...p,items:[...(p.items||[]),{name,icon:icons[name]||'🎁',givenAt:Date.now()}]};
  if(id===me){S=next;players[me]=S;dirty=true;drawBag();toast('وصلتك هدية: '+name);drawOwnerPlayers();return}
  if(!db){toast('إهداء لاعب آخر يحتاج اتصال متعدد اللاعبين');return}
  db.doc('players/'+id).set(next).then(()=>toast('تم إرسال الهدية')).catch(()=>toast('تعذر إرسال الهدية'));
}
function deletePlayer(id){

function celebrateAll(){

  if(!Number.isFinite(amount)||amount<0){toast('المبلغ غير صالح');return}

const cv=R.domElement,ptr=new Map();let moved=0,pd=0;
const pdist=()=>{const [a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
const ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptr.size===2)pd=pdist()});
cv.addEventListener("pointermove",e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===1&&moved>8){const u=11.9*zoom/innerHeight;follow=false;cx=cl(cx-dx*u,-1e6,1e6);cz=cl(cz-dy*u*1.2,-1e6,1e6)}
  else if(ptr.size===2){const d=pdist();zoom=cl(zoom*pd/d,.45,2.6);pd=d;follow=false}
});
function up(e){
  if(ptr.size===1&&moved<=8&&myAv){
    ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
    for(const id in peerAv){const hits=ray.intersectObjects(peerAv[id].children,true);if(hits.length&&players[id]){showProfile(id);ptr.delete(e.pointerId);pd=0;return}}
    const v=new THREE.Vector3();if(ray.ray.intersectPlane(pl,v)){target=v;follow=true}
  }
  ptr.delete(e.pointerId);pd=0;
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>{ptr.delete(e.pointerId)});
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=cl(zoom*(1+e.deltaY*.001),.45,2.6)},{passive:false});

let last=performance.now(),pt=0,lx=0,lz=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-last)/1000,.1);last=now;animateCity(dt);
  if(target){
    const dx=target.x-myAv.position.x,dz=target.z-myAv.position.z,d=Math.hypot(dx,dz);
    if(d<.15)target=null;else{const s=Math.min(7*dt,d);myAv.position.x+=dx/d*s;myAv.position.z+=dz/d*s;myAv.rotation.y=Math.atan2(dx,dz)}
  }
  pt+=dt;
  if(room&&pt>.12){pt=0;const x=myAv.position.x,z=myAv.position.z,mv=Math.abs(x-lx)+Math.abs(z-lz)>.01;
    const pl=()=>({x:+x.toFixed(2),z:+z.toFixed(2),c:(S&&S.outfit?S.outfit.h:hue(me)),n:insta,pet:(S&&S.pets&&S.pets[0]&&S.pets[0].icon)||""});
    const sendP=()=>{window._zxPT=performance.now();window._zxPend=false;try{Promise.resolve(room.presence(pl())).catch(()=>{})}catch(e){}};
    if(mv||!lx){lx=x;lz=z;try{if(room.move)room.move(pl())}catch(e){}
      if(!window._zxPT||performance.now()-window._zxPT>2500)sendP();else window._zxPend=true}
    else if(window._zxPend)sendP();}
  const seen=new Set();
  for(const p of peers){
    if(p.isMe)continue;{const lv=room&&room.live&&room.live[p.peer];if(lv&&Date.now()-lv.t<5000)p.presence={...p.presence,x:lv.x,z:lv.z}}
    if(p.presence.x==null)continue;seen.add(p.peer);
    let a=peerAv[p.peer];
    if(a&&p.presence.c!=null&&a.userData.c!==p.presence.c){a.children[0].material=mat(new THREE.Color().setHSL((+p.presence.c||0)/360,.7,.5).getHex());a.userData.c=p.presence.c}
    if(!a){a=peerAv[p.peer]=avatar(new THREE.Color().setHSL((+p.presence.c||0)/360,.7,.5).getHex(),p.presence.n);a.position.set(+p.presence.x,0,+p.presence.z)}
    const dx=p.presence.x-a.position.x,dz=p.presence.z-a.position.z;
    if(Math.hypot(dx,dz)>.05)a.rotation.y=Math.atan2(dx,dz);
    if(Math.hypot(dx,dz)>14){a.position.x=+p.presence.x;a.position.z=+p.presence.z}else{a.position.x+=dx*Math.min(1,dt*10);a.position.z+=dz*Math.min(1,dt*10)}
  }
  for(const k in peerAv)if(!seen.has(k)){scene.remove(peerAv[k]);delete peerAv[k]}
  $("onl").textContent=seen.size+1;
  if(follow){const k=Math.min(1,dt*4);cx+=(myAv.position.x-cx)*k;cz+=(myAv.position.z-cz)*k}
  cam.position.set(cx,24*zoom,cz+16*zoom);cam.lookAt(cx,0,cz);
  R.render(scene,cam);
}

      const a=Math.max(0,Math.min(300,Math.round(+g.amt||0)));S.giftDone.push(g.id);tot+=a;ln.push("🎁 $"+fmt(a)+" من @"+escapeText(q.insta||""))})}
  if(S.giftDone.length>120)S.giftDone=S.giftDone.slice(-120);
  if(!tot)return;S.money=(Number(S.money)||0)+tot;dirty=true;hud();log("هدايا",tot);
  lifePanel("🎁 وصلتك هدية!",'<div class="lifeCard">'+ln.join("<br>")+'</div><button id="zxX" class="s">تمام</button>');$("zxX").onclick=zxClose;
}
if(typeof showProfile==="function"){const f=showProfile;showProfile=function(id){const r=f.apply(this,arguments);
  setTimeout(()=>{const lp=document.getElementById("lifePanel");if(!lp||id===me||!players[id]||lp.querySelector("#zxGift"))return;
    const t=document.createElement("button");t.id="zxGift";t.textContent="🎁 إرسال هدية";t.onclick=()=>zxGiftSend(id);lp.appendChild(t)},90);return r}}
function zxBoot2(){
  if(window._zxB2||!db)return;window._zxB2=1;
  try{db.doc("world/pinned").onSnapshot(s=>zxPinShow(s&&s.exists?s.data():null))}catch(e){}
  try{db.doc("world/prize").onSnapshot(s=>{window._zxPrize=s&&s.exists?s.data():null;zxPrizeApply()})}catch(e){}
}
setInterval(zxBoot2,900);setInterval(()=>{zxPrizeApply();zxGiftApply()},5000);
/* حيوان أليف يمشي مع اللاعب ويظهر للكل */
const zxPetSp={};
function zxPetTex(ic){const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.font="96px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(ic,64,70);return new THREE.CanvasTexture(c)}
function zxPetFor(key,av,ic,dt){
  let e=zxPetSp[key];if(!ic||!av){if(e){scene.remove(e.sp);delete zxPetSp[key]}return}
  if(!e||e.ic!==ic){if(e)scene.remove(e.sp);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:zxPetTex(ic),transparent:true}));sp.scale.set(1,1,1);sp.position.set(av.position.x-1,.6,av.position.z-1);scene.add(sp);e=zxPetSp[key]={sp,ic}}
  const tx=av.position.x-Math.sin(av.rotation.y)*1.2,tz=av.position.z-Math.cos(av.rotation.y)*1.2,k=Math.min(1,dt*4),mv=Math.hypot(tx-e.sp.position.x,tz-e.sp.position.z)>.3;
  e.sp.position.x+=(tx-e.sp.position.x)*k;e.sp.position.z+=(tz-e.sp.position.z)*k;e.sp.position.y=.55+(mv?Math.abs(Math.sin(Date.now()/160))*.15:0);
}
let zxPetT=performance.now();
function zxPetLoop(){
  requestAnimationFrame(zxPetLoop);if(typeof scene==="undefined"||typeof myAv==="undefined"||!myAv)return;
  const now=performance.now(),dt=Math.min((now-zxPetT)/1000,.1);zxPetT=now;
  zxPetFor("me",myAv,S&&S.pets&&S.pets[0]&&S.pets[0].icon,dt);
  const seen=new Set(["me"]);(peers||[]).forEach(p=>{if(!p||p.isMe)return;const a=peerAv[p.peer];if(a&&p.presence&&p.presence.pet){seen.add(p.peer);zxPetFor(p.peer,a,p.presence.pet,dt)}});
  for(const k in zxPetSp)if(!seen.has(k)){scene.remove(zxPetSp[k].sp);delete zxPetSp[k]}
}
zxPetLoop();
</script>
<script>
(function(){
  const bot=document.getElementById("bot");if(!bot)return;
  const b=document.createElement("button");b.id="botToggle";
  b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);z-index:7;flex:none;width:64px;padding:3px 0;font-size:16px;border-radius:14px 14px 0 0;background:var(--card);color:var(--tx);box-shadow:0 -2px 8px rgba(0,0,0,.2)";
  document.body.appendChild(b);
  bot.style.transition="transform .25s";
  let open=true;try{open=localStorage.getItem("zx_bot")!=="0"}catch(e){}
  const place=()=>{b.style.bottom=open?"calc("+bot.offsetHeight+"px + env(safe-area-inset-bottom,0px) + 8px)":"calc(env(safe-area-inset-bottom,0px) + 6px)"};
  const apply=()=>{bot.style.transform=open?"":"translateY(calc(100% + 24px))";b.textContent=open?"▼":"▲";place()};
  b.onclick=()=>{open=!open;try{localStorage.setItem("zx_bot",open?"1":"0")}catch(e){}apply()};
  if(window.ResizeObserver)new ResizeObserver(place).observe(bot);
  addEventListener("resize",place);apply();
})();
</script>
