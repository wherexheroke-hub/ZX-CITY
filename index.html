<script>
/* ZX shim: يشغّل نفس كود اللعبة فوق Supabase بدل نظام Claude */
const SUPABASE_URL="https://rfbdbmjbuqgmjahajjug.supabase.co";
const SUPABASE_KEY="sb_publishable_VawaIZxL53Dqo1JZAl6Mwg_qN1HKikF";
const OWNER_PUBLIC="ZX GAMES OWNER";
const normName=n=>String(n||"").toLowerCase().replace(/[\s_.]+/g,"");
(function(){
  let sb=null,uid=null,isOwnerFlag=false,roomObj=null;
  const ready=(async()=>{
    if(!/^https:\/\//.test(SUPABASE_URL)||!window.supabase)return false;
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    let{data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    uid=session.user.id;
    if(/[?&#]owner/.test(location.href)){
      const c=prompt("رمز المالك:");
      if(c){const r=await sb.rpc("claim_owner",{code:c});if(r.error)alert("رمز خاطئ")}
    }
    const o=await sb.from("owners").select("id").eq("id",uid).maybeSingle();
    isOwnerFlag=!!o.data;
    if(isOwnerFlag){let k=0;const t=setInterval(()=>{const gi=document.getElementById("gi");if(gi&&!gi.value)gi.value=OWNER_PUBLIC;if(++k>20)clearInterval(t)},250)}
    return true;
  })().catch(e=>{console.error("ZX shim",e);return false});

  const cols={};
  function watcher(col,errCb){
    if(cols[col])return cols[col];
    const w=cols[col]={rows:new Map(),subs:new Set(),ready:false};
    const emit=()=>w.subs.forEach(f=>f());
    sb.from("kv").select("id,data").eq("collection",col).then(r=>{
      if(r.error){console.error(r.error);return}
      r.data.forEach(x=>w.rows.set(x.id,x.data));w.ready=true;emit();
    });
    sb.channel("kv-"+col).on("postgres_changes",{event:"*",schema:"public",table:"kv",filter:"collection=eq."+col},p=>{
      if(p.eventType==="DELETE")w.rows.delete(p.old.id);else w.rows.set(p.new.id,p.new.data);
      emit();
    }).subscribe();
    return w;
  }
  const split=p=>{const i=p.indexOf("/");return[p.slice(0,i),p.slice(i+1)]};
  const dbObj={
    collection(col){return{onSnapshot(cb,err){
      const w=watcher(col);
      const f=()=>{if(w.ready)cb({docs:[...w.rows].map(([id,d])=>({id,exists:true,data:()=>d}))})};
      w.subs.add(f);f();return()=>w.subs.delete(f);
    }}},
    doc(path){
      const[col,id]=split(path);
      return{
        onSnapshot(cb,err){
          const w=watcher(col);
          const f=()=>{if(w.ready)cb({id,exists:w.rows.has(id),data:()=>w.rows.get(id)})};
          w.subs.add(f);f();return()=>w.subs.delete(f);
        },
        async set(data){
          const r=await sb.from("kv").upsert({collection:col,id,data,updated_at:new Date().toISOString()},{onConflict:"collection,id"});
          if(r.error)throw r.error;
          const w=cols[col];if(w){w.rows.set(id,data);w.subs.forEach(f=>f())}
        },
        async delete(){
          const r=await sb.from("kv").delete().eq("collection",col).eq("id",id);
          if(r.error)throw r.error;
          const w=cols[col];if(w){w.rows.delete(id);w.subs.forEach(f=>f())}
        }
      };
    }
  };
  function makeRoom(){
    const ch=sb.channel("zx-room",{config:{presence:{key:uid}}});
    let st={},joined=false;const cbs=[];
    const peersNow=()=>{const ps=ch.presenceState();return Object.keys(ps).map(k=>{const m=ps[k][ps[k].length-1];return{peer:k,isMe:k===uid,presence:(m&&m.p)||{}}})};
    const push=()=>{const peers=peersNow();cbs.forEach(f=>f({peers}))};
    ch.on("presence",{event:"sync"},push).subscribe(s=>{if(s==="SUBSCRIBED"){joined=true;ch.track({p:st})}});
    return{
      onPeers(f){cbs.push(f);push()},
      async presence(p){st={...st,...p};if(joined)await ch.track({p:st})}
    };
  }
  // اسم المالك السري: لا يوجد هنا. السيرفر وحده يعرفه (في Supabase).
  // أي اسم يُكتب في الخانة يُرسل للسيرفر؛ إذا طابق السري يصير هذا الجهاز مالكاً.
  document.addEventListener("click",async e=>{
    const b=e.target.closest&&e.target.closest("#gb");if(!b||!sb||!uid)return;
    const gi=document.getElementById("gi");
    const v=((gi&&gi.value)||"").trim().replace(/^@/,"");
    if(!v)return;
    if(normName(v)===normName(OWNER_PUBLIC)){if(isOwnerFlag)return;e.stopImmediatePropagation();e.preventDefault();alert("هذا الاسم محجوز");return}
    e.stopImmediatePropagation();e.preventDefault();
    const r=await sb.rpc("claim_owner",{code:v});
    if(!r.error){
      if(isOwnerFlag){gi.value=OWNER_PUBLIC;b.onclick&&b.onclick();return}
      location.reload();return;
    }
    b.onclick&&b.onclick();
  },true);
  window.ZX_SIGNOUT=async()=>{if(sb)await sb.auth.signOut()};
  window.claude={async use(name){
    if(!(await ready))return null;
    if(name==="db")return dbObj;
    if(name==="user")return{async id(){return uid},isOwner(){return isOwnerFlag}};
    if(name==="room")return roomObj||(roomObj=makeRoom());
    return null;
  }};
})();

</script>

function familyTrip(place){
 const dest=FAMILY_DESTINATIONS.find(d=>d.key===place);if(!dest){toast("الوجهة غير متاحة حالياً.");return}
 const people=[...(S.family||[]).map((m,i)=>({key:"f"+i,name:m.name,role:m.role,member:m})),...(S.spouse?[{key:"sp",name:S.spouse.name,role:"الشريك",member:S.spouse}]:[]),...(S.children||[]).map((c,i)=>({key:"c"+i,name:c.name,role:"طفل",child:c}))];
 const gas=count=>S.car?Math.max(2,Math.ceil(count/2)*3):0;
 const tripTime=S.car?Math.max(2,Math.ceil(dest.walk/3)):dest.walk;
 const checkboxes=people.map(x=>'<label style="display:block;padding:5px"><input type="checkbox" class="tripPerson" value="'+x.key+'" checked> '+escapeText(x.name)+' ('+escapeText(x.role)+')</label>').join('');
 const payers=people.filter(x=>x.member).map(x=>'<button data-trip-payer="'+x.key+'">اطلب من '+escapeText(x.name)+' يدفع 💳</button>').join('');
 lifePanel(dest.icon+' رحلة عائلية إلى '+dest.name,'<div class="lifeCard"><b>مين رايح معك؟</b><br><label><input type="checkbox" id="tripMe" checked> شخصيتك</label>'+checkboxes+'<hr><span id="tripEstimate"></span><br><b>الإجمالي: <span id="tripTotal"></span></b><br><span id="tripJoy"></span><br>'+(S.car?'وقت السيارة: '+tripTime+' دقائق (أسرع) · البنزين محسوب ضمن التكلفة':'وقت المشي: '+dest.walk+' دقيقة')+'</div><button id="confirmTrip">يلا نروح 🎉</button><button id="cancelTrip">رجوع</button><div class="lifeCard"><b>خلي أحد أفراد العائلة يتكفل بالرحلة</b><br>'+payers+'</div>');
 const selected=()=>[...$("lifePanel").querySelectorAll(".tripPerson:checked")].map(b=>people.find(x=>x.key===b.value)).filter(Boolean);
 const totals=()=>{const count=($("tripMe").checked?1:0)+selected().length;const base=count*dest.price;const fuel=S.car?gas(count):0;return {count,base,fuel,total:base+fuel}};
 const joy=()=>Math.min(25,Math.max(3,Math.round(dest.price/3)));
 const update=()=>{const t=totals();$("tripEstimate").textContent='عدد المشاركين: '+t.count+' · تكلفة المكان: $'+fmt(t.base)+' · '+(S.car?'البنزين: $'+fmt(t.fuel):'بدون سيارة');$("tripTotal").textContent='$'+fmt(t.total);$("tripJoy").textContent='سعادة كل فرد من العائلة المشارك: +'+joy()+' ❤️ (تزيد مع سعر الوجهة)'};
 $("lifePanel").querySelectorAll(".tripPerson").forEach(b=>b.onchange=update);$("tripMe").onchange=update;update();
 const completeTrip=(payer)=>{const t=totals();if(!t.count){toast("اختاروا شخصاً واحداً على الأقل للرحلة.");return}if(payer){const m=payer.member;const chance=m.jobKey?.82:.35;if((Number(m.cash)||0)<t.total||Math.random()>chance){familyMood(m,-2);toast(m.name+" اعتذر عن دفع الرحلة أو لا يملك المبلغ الكافي.");familyPanel();return}m.cash-=t.total;familyMood(m,5);toast(m.name+" تكفّل بالرحلة كاملة ❤️")}else if(!budgetPay(t.total,"رحلة عائلية إلى "+dest.name))return;
 const gain=joy();selected().forEach(x=>{if(x.member)familyMood(x.member,gain);if(x.child)x.child.love=Math.min(100,(x.child.love||60)+gain)});dirty=true;hud();toast("استمتعتم بالرحلة إلى "+dest.name+"! زادت السعادة +"+gain);familyPanel()};
 $("confirmTrip").onclick=()=>completeTrip(null);$("cancelTrip").onclick=familyPanel;
 $("lifePanel").querySelectorAll("[data-trip-payer]").forEach(b=>b.onclick=()=>{const x=people.find(x=>x.key===b.dataset.tripPayer);if(x)completeTrip(x)});
}

function jobSalary(jobId,level){const progress=S.jobs?.[jobId];return Math.round((progress?.famous?1000:level[1])*(Number(WORLD.salaryMultiplier)||1))}
function finishWork(){
  if(!S||!S.workUntil)return;
  const jobId=S.workJob||S.activeJob;
  const level=JOBS[jobId]?.levels?.[(S.jobs?.[jobId]?.level||1)-1];
  if(!level){S.workUntil=null;S.workJob=null;return}
  const salary=jobSalary(jobId,level);S.money=(Number(S.money)||0)+salary;S.earned=(Number(S.earned)||0)+salary;
  const p=S.jobs[jobId];p.works++;
  log("راتب "+JOBS[jobId].name+" - "+level[0],salary);
  S.workUntil=null;S.workJob=null;
  if(p.level<jobMaxLevel(jobId)&&p.works>=promotionCount(p.level)){
    p.level++;p.works=0;
    const next=JOBS[jobId].levels[p.level-1];
    toast("🎉 مبروك! ترقيت إلى "+next[0]+" في "+JOBS[jobId].name);
    log("ترقية إلى "+next[0],0);
    setTimeout(()=>alert("🎉 مبروك الترقية!\nأصبحت: "+next[0]+"\n\nدورك الجديد: "+next[3]+"\n\nراتبك الجديد: $"+next[1]+" مقابل "+next[2]+" دقيقة عمل."),150);
  }else if(p.level===jobMaxLevel(jobId)){toast("أنت في أعلى مستوى! استمر بالعمل لتحصل على راتبك.")}

}

  if(give<30){familyMood(m,1);return zxInfo("💬 يتمنى يساعد",m,"أبشر، بس "+zxPick(L_SORRY),"")}
  m.cash-=give;S.money=(S.money||0)+give;S.earned=(S.earned||0)+give;log("مساعدة من "+m.name,give);familyMood(m,4);dirty=true;hud();
  zxInfo("✅ وافق وأعطاك",m,zxPick(L_YES),'<div class="lifeCard">وصلتك $'+fmt(give)+'</div>');
}
function zxAskWork(m){
  if(m.jobKey)return zxInfo("💼 يعمل بالفعل",m,"أشتغل في "+JOBS[m.jobKey].name+" — مستوى "+(m.jobLevel||1)+".","");
  const d=zxDecide(m);
  if(d==="yes"){const key=zxPick(JOB_KEYS);m.jobKey=key;m.jobLevel=1;familyMood(m,5);dirty=true;return zxInfo("🎉 وافق على العمل",m,zxPick(L_YES)+" رح أبدأ في "+JOBS[key].name+".","")}
  if(d==="later")return zxInfo("🤔 يفكر بالموضوع",m,zxPick(L_THINK),"");
  familyMood(m,-3);dirty=true;zxInfo("🚫 رفض قاطع",m,zxPick(L_NOWORK),"");
}
function askNpcToWork(i){zxAskWork(S.family[i])}

(async()=>{
  if(typeof THREE==="undefined")return;
  try{const c=window.claude;
    if(c){
      try{const u=await c.use("user");if(u){me=(await u.id())||"local";owner=!!u.isOwner()}}catch(e){}
      try{db=await c.use("db")}catch(e){}
      try{room=await c.use("room");if(room)room.onPeers(ch=>peers=ch.peers)}catch(e){}
      try{db.doc("world/announcement").onSnapshot(s=>{if(s&&s.exists){const a=s.data();if(a&&Date.now()-a.at<20000&&a.id!==window._zxLastAnnouncement){window._zxLastAnnouncement=a.id;toast(a.text||"🎉 احتفال في العالم!")}}})}catch(e){}
      try{db.doc("world/settings").onSnapshot(s=>{if(s&&s.exists){WORLD={...WORLD_DEFAULTS,...s.data()};if($("ownerPanel").style.display==="block"&&owner){$("houseMult").value=WORLD.housePriceMultiplier;$("carMult").value=WORLD.carPriceMultiplier;$("salaryMult").value=WORLD.salaryMultiplier}}})}catch(e){}
    }
  }catch(e){}
  if(!db||me==="local"){db=null;me="local";S=localLoad();players=S?{local:S}:{};gotP=true;tryStart();return}
  const t=setTimeout(()=>{if(!gotP){gotP=true;tryStart()}},10000);
  db.doc("approved/"+me).onSnapshot(s=>{approved=!!s.exists;tryStart()},()=>{});
  db.collection("players").onSnapshot(snap=>{
    players={};snap.docs.forEach(d=>players[d.id]=d.data());
    if(!started){clearTimeout(t);gotP=true;S=players[me]||null;tryStart()}
    else{if(players[me]){S={...S,...players[me]};normalizeJobs();hud();updateWorkButton();if($("bag").style.display==="block")drawBag()}else if(S)players[me]=S;syncHouses()}
  },()=>{if(!gotP){gotP=true;tryStart()}});
})();
